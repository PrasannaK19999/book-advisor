services:
  db:
    image: pgvector/pgvector:pg16
    container_name: book_advisor_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: bookadmin
      POSTGRES_PASSWORD: bookpass
      POSTGRES_DB: bookadvisor
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: .
    container_name: book_advisor_app
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://bookadmin:bookpass@db:5432/bookadvisor
      GROQ_API_KEY: ${GROQ_API_KEY}
      GOOGLE_BOOKS_API_KEY: ${GOOGLE_BOOKS_API_KEY}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}

volumes:
  postgres_data: